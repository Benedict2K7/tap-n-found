```
<!-- ================= NAVBAR ================= -->

<header class="navbar">

    <div class="nav-container">

        <a href="/" class="logo">
            <span class="logo-main">TNF</span>
            <span class="logo-text">Tap N Found</span>
        </a>

    </div>

</header>


<!-- ================= NFC PAGE ================= -->

<main class="nfc-page">

    <div class="nfc-card">

        <div class="nfc-logo">
            TNF
        </div>

        <h1>Tap N Found</h1>

        <div id="status" class="nfc-status">
            Loading NFC information...
        </div>


        <!-- ================= NFC DETAILS ================= -->

        <div id="details" class="nfc-details" style="display: none;">

            <div>
                <span class="nfc-label">NFC ID:</span>
                <span id="nfcId"></span>
            </div>

            <div>
                <span class="nfc-label">Item:</span>
                <span id="item"></span>
            </div>

            <div>
                <span class="nfc-label">Course:</span>
                <span id="course"></span>
            </div>

            <div>
                <span class="nfc-label">Status:</span>
                <span id="nfcStatus"></span>
            </div>


            <!-- ================= CHAT BUTTON ================= -->

            <button
                id="chatButton"
                class="chat-button"
                type="button"
                disabled
            >
                Loading...
            </button>

        </div>

    </div>

</main>


<!-- ================= JAVASCRIPT ================= -->

<script>

    // =====================================================
    // BACKEND URL
    // =====================================================

    const API_URL = "https://tap-n-found.onrender.com";


    // =====================================================
    // GET NFC ID FROM URL
    // =====================================================

    function getNfcIdFromUrl() {

        // -----------------------------------------------
        // OPTION 1:
        // /nfc.html?nfcId=TNF-MUZ5328W
        // -----------------------------------------------

        const params = new URLSearchParams(
            window.location.search
        );

        const queryNfcId = params.get("nfcId");

        if (queryNfcId) {

            return queryNfcId.trim();

        }


        // -----------------------------------------------
        // OPTION 2:
        // /nfc/TNF-MUZ5328W
        // -----------------------------------------------

        const path = window.location.pathname;

        const match = path.match(
            /^\/nfc\/([^\/]+)\/?$/i
        );

        if (match && match[1]) {

            return decodeURIComponent(
                match[1]
            ).trim();

        }

        return null;
    }


    // =====================================================
    // NFC ID
    // =====================================================

    const nfcId = getNfcIdFromUrl();


    // =====================================================
    // HTML ELEMENTS
    // =====================================================

    const statusElement =
        document.getElementById("status");

    const detailsElement =
        document.getElementById("details");

    const nfcIdElement =
        document.getElementById("nfcId");

    const itemElement =
        document.getElementById("item");

    const courseElement =
        document.getElementById("course");

    const nfcStatusElement =
        document.getElementById("nfcStatus");

    const chatButton =
        document.getElementById("chatButton");


    // =====================================================
    // START
    // =====================================================

    if (!nfcId) {

        statusElement.textContent =
            "NFC ID is missing.";

        statusElement.classList.add("error");

        chatButton.disabled = true;

    } else {

        console.log(
            "TNF NFC ID detected:",
            nfcId
        );

        loadNfc();

    }


    // =====================================================
    // LOAD NFC
    // =====================================================

    async function loadNfc() {

        try {

            statusElement.textContent =
                "Checking NFC...";


            // ---------------------------------------------
            // CHECK NFC FORMAT
            // ---------------------------------------------

            if (
                !nfcId
                    .toUpperCase()
                    .startsWith("TNF-")
            ) {

                throw new Error(
                    "Invalid TNF NFC ID."
                );

            }


            // ---------------------------------------------
            // IDENTIFY API
            // ---------------------------------------------

            const identifyUrl =
                `${API_URL}/api/nfc/${encodeURIComponent(nfcId)}/identify`;

            console.log(
                "Calling identify API:",
                identifyUrl
            );


            // ---------------------------------------------
            // FETCH NFC
            // ---------------------------------------------

            const response = await fetch(
                identifyUrl,
                {
                    method: "GET",
                    credentials: "include",
                    headers: {
                        "Accept": "application/json"
                    }
                }
            );


            // ---------------------------------------------
            // READ RESPONSE
            // ---------------------------------------------

            let data;

            try {

                data = await response.json();

            } catch (jsonError) {

                throw new Error(
                    `Server returned an invalid response. HTTP ${response.status}`
                );

            }


            console.log(
                "Identify response:",
                data
            );


            // ---------------------------------------------
            // CHECK HTTP STATUS
            // ---------------------------------------------

            if (!response.ok) {

                throw new Error(
                    data.message ||
                    data.error ||
                    `NFC request failed. HTTP ${response.status}`
                );

            }


            // ---------------------------------------------
            // CHECK NFC DATA
            // ---------------------------------------------

            if (!data.nfc) {

                throw new Error(
                    "NFC information was not returned by the server."
                );

            }


            const nfc = data.nfc;


            // ---------------------------------------------
            // DISPLAY NFC INFORMATION
            // ---------------------------------------------

            nfcIdElement.textContent =
                nfc.nfcId || nfcId;

            itemElement.textContent =
                nfc.item || "Unknown";

            courseElement.textContent =
                nfc.course || "Not available";

            nfcStatusElement.textContent =
                nfc.status || "Unknown";


            detailsElement.style.display =
                "block";


            // ---------------------------------------------
            // OWNER
            // ---------------------------------------------

            if (data.role === "owner") {

                statusElement.textContent =
                    "This NFC belongs to your account.";

                statusElement.classList.remove(
                    "error"
                );

                statusElement.classList.add(
                    "success"
                );


                chatButton.disabled = false;

                chatButton.textContent =
                    "Open Owner Dashboard";


                chatButton.onclick =
                    function () {

                        window.location.href =
                            `/owner.html?nfcId=${encodeURIComponent(nfcId)}`;

                    };


                return;
            }


            // ---------------------------------------------
            // FINDER
            // ---------------------------------------------

            if (data.role === "finder") {

                statusElement.textContent =
                    "NFC sticker found. You can contact the owner.";

                statusElement.classList.remove(
                    "error"
                );

                statusElement.classList.add(
                    "success"
                );


                chatButton.disabled = false;

                chatButton.textContent =
                    "Start Private Chat";


                chatButton.onclick =
                    startPrivateChat;


                return;
            }


            // ---------------------------------------------
            // UNKNOWN ROLE
            // ---------------------------------------------

            throw new Error(
                "Unable to determine NFC user role."
            );

        } catch (error) {

            console.error(
                "NFC loading error:",
                error
            );


            statusElement.textContent =
                error.message ||
                "Unable to load NFC information.";


            statusElement.classList.remove(
                "success"
            );

            statusElement.classList.add(
                "error"
            );


            detailsElement.style.display =
                "none";

            chatButton.disabled = true;

        }

    }


    // =====================================================
    // START PRIVATE CHAT
    // =====================================================

    async function startPrivateChat() {

        try {

            chatButton.disabled = true;

            chatButton.textContent =
                "Creating private chat...";


            console.log(
                "Starting chat for:",
                nfcId
            );


            // ---------------------------------------------
            // CHAT API
            // ---------------------------------------------

            const chatUrl =
                `${API_URL}/api/chat/start`;


            console.log(
                "Calling chat API:",
                chatUrl
            );


            // ---------------------------------------------
            // CREATE CHAT
            // ---------------------------------------------

            const chatResponse =
                await fetch(
                    chatUrl,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"
                        },

                        credentials:
                            "include",

                        body:
                            JSON.stringify({
                                nfcId: nfcId
                            })
                    }
                );


            // ---------------------------------------------
            // READ CHAT RESPONSE
            // ---------------------------------------------

            let chatData;

            try {

                chatData =
                    await chatResponse.json();

            } catch (jsonError) {

                throw new Error(
                    `Chat server returned an invalid response. HTTP ${chatResponse.status}`
                );

            }


            console.log(
                "Chat response:",
                chatData
            );


            // ---------------------------------------------
            // CHECK RESPONSE
            // ---------------------------------------------

            if (!chatResponse.ok) {

                throw new Error(
                    chatData.message ||
                    chatData.error ||
                    `Unable to create private chat. HTTP ${chatResponse.status}`
                );

            }


            // ---------------------------------------------
            // CHECK CHAT DATA
            // ---------------------------------------------

            if (
                !chatData.chatId ||
                !chatData.finderToken
            ) {

                throw new Error(
                    "Chat was created but chat access information is missing."
                );

            }


            // ---------------------------------------------
            // OPEN CHAT
            // ---------------------------------------------

            const chatPage =
                `/chat.html` +
                `?nfcId=${encodeURIComponent(nfcId)}` +
                `&chatId=${encodeURIComponent(chatData.chatId)}` +
                `&role=finder` +
                `&token=${encodeURIComponent(chatData.finderToken)}`;


            console.log(
                "Opening chat:",
                chatPage
            );


            window.location.href =
                chatPage;


        } catch (error) {

            console.error(
                "Chat error:",
                error
            );


            alert(
                error.message ||
                "Unable to start private chat."
            );


            chatButton.disabled =
                false;

            chatButton.textContent =
                "Start Private Chat";

        }

    }

</script>
