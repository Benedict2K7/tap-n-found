[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  external_node_modules = ["express", "mongoose"]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
     from = "/nfc/*"
     to = "/nfc.html"
     status = 200